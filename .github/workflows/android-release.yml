name: Android APK Release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example android-v1.0.0'
        required: true
        default: 'android-v1.0.0'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build installable APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Normalize APK name
        run: cp app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Loomora ${{ github.event.inputs.tag || github.ref_name }}
          files: app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
