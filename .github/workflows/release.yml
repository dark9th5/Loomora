name: Loomora Release Build

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      LOOMORA_STORE_FILE: ${{ github.workspace }}/release-signing/loomora-release.jks
      LOOMORA_STORE_PASSWORD: ${{ secrets.LOOMORA_STORE_PASSWORD }}
      LOOMORA_KEY_ALIAS: ${{ secrets.LOOMORA_KEY_ALIAS }}
      LOOMORA_KEY_PASSWORD: ${{ secrets.LOOMORA_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          LOOMORA_STORE_FILE_BASE64: ${{ secrets.LOOMORA_STORE_FILE_BASE64 }}
        run: |
          if [ -z "$LOOMORA_STORE_FILE_BASE64" ]; then
            echo "Missing GitHub secret LOOMORA_STORE_FILE_BASE64. Configure it with the base64-encoded production keystore before running a real release build." >&2
            exit 1
          fi
          mkdir -p "$(dirname "$LOOMORA_STORE_FILE")"
          printf '%s' "$LOOMORA_STORE_FILE_BASE64" | base64 --decode > "$LOOMORA_STORE_FILE"

      - name: Validate release signing inputs
        run: ./gradlew :app:validateReleaseSigning

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: loomora-release-apk
          path: app/build/outputs/apk/release/*.apk
